name: Publish Outlook release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore the solution
        run: dotnet restore CompuMaster.Data.Outlook.sln
      - name: Build the solution
        run: dotnet build CompuMaster.Data.Outlook.sln --configuration Release --no-restore
      - name: Pack the Outlook library
        run: dotnet pack CompuMaster.Data.Outlook/CompuMaster.Data.Outlook.vbproj --configuration Release --no-build --no-restore --output packages
      - name: Verify the release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -creplace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$' -or
              -not (Test-Path -LiteralPath "packages/CompuMaster.Data.Outlook.$version.nupkg" -PathType Leaf)) {
              throw "The release tag does not match the built Outlook package version."
          }
      - name: Archive the Outlook export application
        shell: pwsh
        run: Compress-Archive -Path ExtractPstData/bin/Release/net48/* -DestinationPath OutlookExportToExcelOrCsv.zip
      - name: Upload the export application to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: OutlookExportToExcelOrCsv.zip
          fail_on_unmatched_files: true
      - name: Upload the built NuGet package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Outlook NuGet package
          path: packages/*.nupkg
          if-no-files-found: error
      - name: Authenticate to NuGet.org via Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the Outlook package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -creplace '^v', ''
          dotnet nuget push "packages/CompuMaster.Data.Outlook.$version.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
