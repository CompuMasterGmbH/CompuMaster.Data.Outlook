name: Build and pack Outlook

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore the solution
        run: dotnet restore CompuMaster.Data.Outlook.sln
      - name: Build the solution
        run: dotnet build CompuMaster.Data.Outlook.sln --configuration Release --no-restore
      - name: Pack the Outlook library
        run: dotnet pack CompuMaster.Data.Outlook/CompuMaster.Data.Outlook.vbproj --configuration Release --no-build --no-restore --output packages
